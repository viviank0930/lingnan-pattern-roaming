<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#16140e">
  <meta name="description" content="在流动的岭南陶器纹饰中漫游。拖动探索，点选查看纹饰名称与时期，以水墨拓印呈现。">
  <title>纹饰漫游</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath fill='%2316140e' d='M0 0h64v64H0z'/%3E%3Cpath fill='none' stroke='%23c5ae72' stroke-width='3' d='M12 50V12h38v28H24V24h14v5'/%3E%3C/svg%3E">
  <link rel="preload" href="assets/huiwen.woff2?v=table-20261022-1" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css?v=table-20261022-1">
  <script src="app.js?v=table-20261022-1" defer></script>
</head>
<body>
  <main id="experience" data-style="ink" data-flow="moving">
    <div class="paper" aria-hidden="true"></div>
    <div class="grain" aria-hidden="true"></div>
    <canvas id="field" tabindex="0" role="application" aria-label="纹饰漫游。拖动浏览；点击或按方向键选择纹饰，按Esc取消选中。"></canvas>
    <header class="masthead">
      <div class="identity"><h1>纹饰漫游</h1><span>岭南陶器纹饰</span></div>
      <span class="style-label">水墨拓印</span>
    </header>
    <section class="detail" id="detail" aria-label="选中纹饰" hidden>
      <button id="close-detail" class="close" type="button" aria-label="取消选中，继续流动">×</button>
      <div class="detail-rule" aria-hidden="true"></div>
      <h2 id="pattern-name"></h2>
      <p id="pattern-period"></p>
      <p id="pattern-description" class="pattern-description" hidden></p>
      <span class="detail-note">点击空白处，继续漫游</span>
    </section>
    <footer class="controls">
      <p id="interaction-hint">拖动浏览 <span>·</span> 点击纹饰停驻</p>
      <div class="utility"><span class="flow-state" id="flow-state" role="status" aria-live="polite">缓缓流动</span><button id="reset-view" type="button">回到初始位置</button></div>
    </footer>
    <div class="loading" id="loading" role="status">纹饰正在铺开<span>……</span></div>
    <div class="error" id="error" hidden><p>纹饰暂时未能载入</p><button type="button" id="retry">重新载入</button></div>
    <p class="sr-only" id="selection-announcement" role="status" aria-live="polite"></p>
  </main>
</body>
</html>
